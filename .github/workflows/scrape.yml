name: Eurostar SNAP Scraper

on:
  schedule:
    # Offset off the :00/:10 boundary - those are the most contended slots on
    # GitHub's shared schedulers and get delayed the most.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

# A run polls for ~25 min, so runs can overlap. Let the in-flight one finish
# rather than cancelling it mid-poll and losing its state save.
concurrency:
  group: snap-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        # Browser binary is cached; system deps are baked into the runner image,
        # so only a cache miss needs the slow install-deps path.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: previous_state.json
          key: snap-state-${{ github.run_id }}
          restore-keys: |
            snap-state-

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Keep checking within the run so detection latency is ~3 min instead
          # of however long GitHub takes to start the next scheduled run.
          POLL_DURATION_MINUTES: '25'
          POLL_INTERVAL_SECONDS: '180'
        run: python scraper.py

      - name: Save current state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: previous_state.json
          key: snap-state-${{ github.run_id }}

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-screenshot
          path: snap_screenshot.png
          retention-days: 1
